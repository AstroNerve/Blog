<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff2430"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>AstroNerve Gaming | Account</title></head><body data-page="login">

<main class="account-page"><section class="account-card reveal"><img class="account-logo" src="assets/logo.jpg" alt="AstroNerve Gaming"><h1>Squad account</h1><p>Save your squad identity and keep your AstroNerve experience ready across the app.</p><div class="auth-tabs"><button class="active" data-auth-mode="login">Log in</button><button data-auth-mode="signup">Create account</button></div><form data-auth-form><input type="hidden" name="mode" value="login"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" required></div><button class="btn btn-primary" data-submit style="width:100%" type="submit">LOG IN</button></form><button class="btn btn-ghost oauth" data-google style="width:100%">Continue with Google</button><p class="account-note">Google sign-in is intentionally not connected until you supply your OAuth credentials. See CONFIG_REQUIRED.txt.</p><a class="account-back" href="index.html">Return to AstroNerve</a></section></main><div class="toast"></div><script src="site-config.js"></script><script src="app.js"></script></body></html>
